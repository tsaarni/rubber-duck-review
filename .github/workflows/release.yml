name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v6.0.9
        with:
          version: 9

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Lint & Types
        run: |
          pnpm run check
          pnpm run compile

      - name: Run Integration Tests
        run: xvfb-run -a pnpm test

      - name: Package VSIX
        run: pnpm run package

      - name: Create Release
        run: gh release create "$GITHUB_REF_NAME" rubber-duck-review.vsix --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
